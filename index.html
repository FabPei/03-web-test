<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Mobile Test 03</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; }
    main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #334155; border-radius: 1.25rem; background: #111827; }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.7rem, 8vw, 2.5rem); }
    p { margin: 0; color: #cbd5e1; line-height: 1.6; }
    small { display: block; margin-top: 1.5rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>Mobile Test 03</h1>
    <p>Die statische Testumgebung ist bereit.</p>
    <small>Keine externen Daten oder Dienste eingebunden.</small>
  </main>
</body>
</html>
